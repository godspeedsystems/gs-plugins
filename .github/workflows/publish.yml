name: Publish changed plugins

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Get changed plugin directories
        id: plugins
        run: |
          echo "Detecting changed plugins..."

          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)

          PLUGINS=$(echo "$CHANGED_FILES" \
            | grep '^plugins/' \
            | cut -d/ -f2 \
            | sort -u)

          if [ -z "$PLUGINS" ]; then
            echo "No plugin changes detected."
            echo "plugins=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Changed plugins:"
          echo "$PLUGINS"

          PLUGINS_JSON=$(printf '%s\n' "$PLUGINS" | jq -R . | jq -s .)
          echo "plugins=$PLUGINS_JSON" >> $GITHUB_OUTPUT

      - name: Publish plugins
        if: steps.plugins.outputs.plugins != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for plugin in $(echo '${{ steps.plugins.outputs.plugins }}' | jq -r '.[]'); do
            echo "-------------------------------------"
            echo "Processing plugin: $plugin"
            echo "-------------------------------------"

            cd "plugins/$plugin"

            NAME=$(node -p "require('./package.json').name")
            VERSION=$(node -p "require('./package.json').version")

            echo "Package: $NAME"
            echo "Version: $VERSION"

            if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
              echo "⚠️ $NAME@$VERSION already published. Skipping."
            else
              echo "🚀 Publishing $NAME@$VERSION"
              npm publish
            fi

            cd - > /dev/null
          done
